# Ball Knowledge-Play – Einsätze, Tore und Titelanzahl aus Wikipedia ergänzen
# Start: GitHub → Reiter „Actions“ → „Spielerdaten aktualisieren“ → „Run workflow“.
#   Probelauf: Feld „Probelauf“ auf z. B. 300 lassen → nur Bericht (stats_report.txt), nichts wird geändert.
#   Volllauf:  Feld „Probelauf“ auf 0 setzen → neue players.json landet im Branch „daten-update“.
name: Spielerdaten aktualisieren

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Probelauf mit so vielen Spielern (0 = alle Spieler, dauert ca. 1–2 Stunden)"
        required: true
        default: "300"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten holen und auswerten
        run: python stats_update.py --players players.json --out players.json --report stats_report.txt --limit "${{ inputs.limit }}"

      - name: Ergebnis zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: spielerdaten
          path: |
            players.json
            stats_report.txt

      - name: Im Branch daten-update speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B daten-update
          git add players.json stats_report.txt
          git commit -m "Spielerdaten: Ligaspiele, Ligatore, Titelanzahl (Wikipedia, CC BY-SA 4.0)" || echo "Keine Änderungen"
          git push -f origin daten-update
